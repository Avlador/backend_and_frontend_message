name: Backend CI (Prisma + Node.js)


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      DATABASE_URL: "postgresql://user:password@postgres:5432/mydb?schema=public"

    defaults:
      run:
        working-directory: ./back

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm ci

    - name: Initialize Prisma Client
      run: |
        npx prisma generate

    - name: Run backend server in background
      run: |
        npm start &
        sleep 5

    - name: Smoke test backend server
      run: |
        curl -v http://127.0.0.1:3000/
